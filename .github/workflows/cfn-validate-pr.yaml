name: Validate CloudFormation on PR

on:
  pull_request:
    paths:
      - 'cloudformation/**'
    
    types:
      - opened # Trigger when a new PR is created
      - synchronize # Trigger when the PR is updated
      - reopened # Trigger when a closed PR is reopened
      - closed # Trigger when the PR is closed (for cleanup only)

permissions:
  pull_requests: write
  contents: read

# Skip deployment if the Pull Request is closed
jobs:
  validate-cfn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ap-northeast-1

      - name: Validate Cloudformation template
        run: |
          aws cloudformation validate-template --template-body file://cloudformation/s3-bucket.yaml

      - name: Deploy Our Stack
        run: |
          stack_name="pr-test-stack-${{github.event.pull_request.number}}"
          aws cloudformation create-stack --stack-name $stack_name --template-body file://cloudformation/s3-bucket.yaml --parameters ParameterKey=Environment,ParameterValue=test
        continue-on-error: false # Ensure that errors prevent further steps from running



      - name: Comment on the Pull Request
        uses: actions/github-script@v6
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Cloudformation test stack deployed. Stack name: pr-test-stack-${{ github.event.pull_request.number}}'
            })

  cleanup-on-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ap-northeast-1

      - name: Delete Cloudformation Test Stack
        run: |
          stack_name="pr-test-stack-${{github.event.pull_request.number}}"
          echo "Deleting stack: $stack_name"
          aws cloudformation delete-stack --stack-name $stack_name